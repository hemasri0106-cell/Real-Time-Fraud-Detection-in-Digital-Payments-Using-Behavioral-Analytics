<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Shield Icon -->
  <g transform="translate(6, 4)">
    <path d="M16 2 L28 7 V18 C28 25 16 30 16 30 C16 30 4 25 4 18 V7 L16 2 Z" fill="#0F172A" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M10 16 L14 20 L22 12" stroke="url(#pulseGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <circle cx="16" cy="16" r="1.5" fill="#00F0FF" />
  </g>
  <!-- Wordmark -->
  <text x="44" y="26" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" letter-spacing="-0.5">FRAUD<tspan fill="#00F0FF">EC</tspan></text>
  <rect x="126" y="14" width="24" height="12" rx="3" fill="#1E293B" stroke="#00F0FF" stroke-width="0.75" />
  <text x="138" y="23" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="7" fill="#00F0FF" text-anchor="middle" letter-spacing="0.5">ML-AI</text>
</svg>
