<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>{% block title %}Fraudec{% endblock %}</title>

  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="{{ url_for('static', path='theme.js') }}"></script>

  {% block head %}{% endblock %}
</head>
<body class="bg-background font-body-md text-on-surface antialiased min-h-screen">
  <!--
    No aside/header shell here on purpose - unlike base.html, an auth
    page (login, signup, etc.) doesn't share the dashboard sidebar/nav.
    Each page extending this owns its own header, main, and footer inside
    the content block below, and can reference the shared logo via the
    url_for static helper.
  -->
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
